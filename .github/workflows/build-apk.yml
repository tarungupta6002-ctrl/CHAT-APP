name: Build ChatHub Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Accept Android Licenses & Pre-install Android 36 SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ChatHub.apk

      - name: Upload ChatHub APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatHub-Android-APK
          path: android/app/build/outputs/apk/debug/ChatHub.apk
          retention-days: 14

      - name: Publish Direct GitHub Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: ChatHub Android App (Latest)
          body: "Official ChatHub Android APK with native status bar padding and notch optimization."
          files: android/app/build/outputs/apk/debug/ChatHub.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
